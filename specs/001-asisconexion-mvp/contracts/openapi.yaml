openapi: 3.1.0
info:
  title: AsisConexión Backend API
  version: 2.0.0
  description: >-
    Contrato OpenAPI-First (SDD v2) del Monolito Modular AsisConexión Backend.
    Opera con persistencia única PostgreSQL (ASISCONEXION_DB) e integración HTTP
    con el servicio central de identidad en Render/Supabase.
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local
tags:
  - name: AuthSession
    description: Login y registro vía Render/Supabase, sesiones por dispositivo y perfiles Actor / Conexiones
  - name: Social
    description: Categorías públicas, publicaciones con múltiples URLs multimedia, hilos de comentarios y reacciones
  - name: Moderation
    description: Filtro automático (ContentFilterService), moderación humana (ADMIN/MODERATOR) y gestión de moderadores globales
  - name: Directory
    description: Enlaces limpios hacia módulos satélites (SUMA 21, AULA UP, SAGA-UP)
  - name: Assistant
    description: Orientación FAQ con disclaimer y escalamiento humano a WhatsApp (IAssistantEngineProvider)

components:
  securitySchemes:
    DeviceSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT local emitido por AsisConexión (`device_token`) validado por `DeviceSessionGuard`.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  schemas:
    ProblemDetails:
      type: object
      description: Estándar RFC 7807 (application/problem+json) emitido por AllExceptionsFilter.
      required: [type, title, status, detail, instance, timestamp]
      properties:
        type:
          type: string
          format: uri
          example: https://asisconexion.org/problems/conflict
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: El username o email ya se encuentra registrado en el ecosistema fundacional.
        instance:
          type: string
          example: /v1/auth/registro
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    PaginationMetaDto:
      type: object
      required: [page, limit, total_items, total_pages, has_next_page]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total_items:
          type: integer
          example: 42
        total_pages:
          type: integer
          example: 3
        has_next_page:
          type: boolean
          example: true

    RegisterUserDto:
      type: object
      required: [username, email, clave, rol, accept_consent]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 80
          example: maria.acudiente
        email:
          type: string
          format: email
          maxLength: 120
          example: maria@prueba.com
        clave:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: ClaveAcudiente2026
        rol:
          type: string
          maxLength: 40
          enum: [ACUDIENTE, VOLUNTARIO, INVERSOR, BENEFICIARIO, ADMIN]
          example: ACUDIENTE
        accept_consent:
          type: boolean
          const: true
          description: Aceptación obligatoria Ley 1581 de 2012 y Ley 1098 de 2006.
          example: true

    SyncSessionDto:
      type: object
      required: [accept_consent]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 120
          description: Correo electrónico registrado en el servicio central de autenticación (Render / Supabase).
          example: maria@prueba.com
        identifier:
          type: string
          maxLength: 120
          description: Alias opcional (email o username) para compatibilidad.
          example: maria@prueba.com
        clave:
          type: string
          minLength: 6
          maxLength: 128
          writeOnly: true
          example: ClaveAsisco2026
        accept_consent:
          type: boolean
          const: true
          example: true

    PublicUserDto:
      type: object
      description: DTO público segregado (ISP) — jamás incluye clave ni tokens internos.
      required: [id, username, email, rol]
      properties:
        id:
          type: string
          format: uuid
        external_user_id:
          type: [integer, 'null']
          example: 42
        username:
          type: string
          example: maria.acudiente
        email:
          type: string
          format: email
          example: maria@prueba.com
        rol:
          type: string
          example: ACUDIENTE
        external_roles:
          type: array
          items:
            type: string
          example: [ACUDIENTE]
        local_role:
          type: [string, 'null']
          enum: [MODERATOR, null]
          example: null

    AuthSessionResponseDto:
      type: object
      required: [user, device_token, synced_with_external_auth]
      properties:
        user:
          $ref: '#/components/schemas/PublicUserDto'
        device_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        synced_with_external_auth:
          type: boolean
          example: true

    ActorProfileResponseDto:
      type: object
      required: [id, user_account_id, primary_role, first_names, last_names, avatar_url, short_bio, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_account_id:
          type: string
          format: uuid
        primary_role:
          type: string
          example: ACUDIENTE
        first_names:
          type: [string, 'null']
          example: María Fernanda
        last_names:
          type: [string, 'null']
          example: Gómez Pérez
        avatar_url:
          type: [string, 'null']
          format: uri
        short_bio:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateActorProfileDto:
      type: object
      additionalProperties: false
      properties:
        primary_role:
          type: string
          maxLength: 50
        first_names:
          type: string
          maxLength: 100
        last_names:
          type: string
          maxLength: 100
        avatar_url:
          type: string
          format: uri
          maxLength: 500
        short_bio:
          type: string
          maxLength: 300

    CreateActorConnectionDto:
      type: object
      required: [receiver_actor_id]
      additionalProperties: false
      properties:
        receiver_actor_id:
          type: string
          format: uuid

    UpdateActorConnectionStatusDto:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ACCEPTED, BLOCKED]

    ActorConnectionItemDto:
      type: object
      required: [id, requester_actor_id, receiver_actor_id, status, requested_at, accepted_at]
      properties:
        id:
          type: string
          format: uuid
        requester_actor_id:
          type: string
          format: uuid
        receiver_actor_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACCEPTED, BLOCKED]
        requested_at:
          type: string
          format: date-time
        accepted_at:
          type: [string, 'null']
          format: date-time

    InitAnonymousSessionDto:
      type: object
      required: [accept_consent]
      additionalProperties: false
      properties:
        nickname:
          type: string
          maxLength: 50
          example: MamáDeMateo
        role_tag:
          type: string
          maxLength: 40
          example: ACUDIENTE
        accept_consent:
          type: boolean
          const: true
          example: true

    AnonymousSessionResponseDto:
      type: object
      required: [device_token, session_id]
      properties:
        device_token:
          type: string
        session_id:
          type: string
          format: uuid

    CategoryItemDto:
      type: object
      required: [id, name, main_topic, description, cover_image_url]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Apoyo Pedagógico
        main_topic:
          type: string
          example: Educación
        description:
          type: string
          example: Espacio para compartir experiencias educativas y acompañamiento familiar.
        cover_image_url:
          type: [string, 'null']
          format: uri

    AuthorBadgeDto:
      type: object
      required: [display_name, role_label, is_registered]
      properties:
        display_name:
          type: string
          example: maria.acudiente
        role_label:
          type: string
          example: ACUDIENTE
        is_registered:
          type: boolean
          example: true

    ApprovedCommentItemDto:
      type: object
      required: [id, parent_id, content, author, created_at]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: [string, 'null']
          format: uuid
        content:
          type: string
        author:
          $ref: '#/components/schemas/AuthorBadgeDto'
        created_at:
          type: string
          format: date-time

    PublicPostItemDto:
      type: object
      required: [id, category_id, content, media_urls, author, reactions_summary, comments_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        content:
          type: string
        image_url:
          type: [string, 'null']
          format: uri
        media_urls:
          type: array
          items:
            type: string
            format: uri
        author:
          $ref: '#/components/schemas/AuthorBadgeDto'
        reactions_summary:
          type: object
          required: [LIKE, SUPPORT, THANKS]
          properties:
            LIKE:
              type: integer
            SUPPORT:
              type: integer
            THANKS:
              type: integer
        comments_count:
          type: integer
        recent_comments:
          type: array
          items:
            $ref: '#/components/schemas/ApprovedCommentItemDto'
        created_at:
          type: string
          format: date-time

    CreatePostDto:
      type: object
      required: [category_id, content]
      additionalProperties: false
      properties:
        category_id:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 2000
        image_url:
          type: string
          format: uri
          maxLength: 500
        media_urls:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri

    PendingSubmissionResponseDto:
      type: object
      required: [id, status, rejection_reason, message, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, REJECTED]
          example: PENDING
        rejection_reason:
          type: [string, 'null']
          enum: [AUTO_FILTER, HUMAN, null]
          example: null
        message:
          type: string
          example: Contenido recibido y enviado a moderación humana antes de su publicación.
        created_at:
          type: string
          format: date-time

    CreateCommentDto:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
        parent_id:
          type: string
          format: uuid

    ToggleReactionDto:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [LIKE, SUPPORT, THANKS]
          example: SUPPORT

    ToggleReactionResponseDto:
      type: object
      required: [post_id, type, active]
      properties:
        post_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [LIKE, SUPPORT, THANKS]
        active:
          type: boolean
          description: true si la reacción quedó activa; false si fue retirada.

    ToggleCommentReactionResponseDto:
      type: object
      required: [comment_id, type, active]
      properties:
        comment_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [LIKE, SUPPORT, THANKS]
        active:
          type: boolean

    ModeratorUserItemDto:
      type: object
      required: [id, username, email, rol, local_role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        rol:
          type: string
        local_role:
          type: [string, 'null']
          enum: [MODERATOR, null]

    ModerationPendingItemDto:
      type: object
      required: [id, item_type, content, status, device_id, author, created_at]
      properties:
        id:
          type: string
          format: uuid
        item_type:
          type: string
          enum: [POST, COMMENT]
        post_id:
          type: [string, 'null']
          format: uuid
        category_id:
          type: [string, 'null']
          format: uuid
        content:
          type: string
        image_url:
          type: [string, 'null']
        status:
          type: string
          enum: [PENDING]
        device_id:
          type: string
          format: uuid
        user_account_id:
          type: [string, 'null']
          format: uuid
        author:
          $ref: '#/components/schemas/AuthorBadgeDto'
        created_at:
          type: string
          format: date-time

    UpdateModerationStatusDto:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
          example: APPROVED

    ModerationStatusUpdatedDto:
      type: object
      required: [id, item_type, status, updated_at]
      properties:
        id:
          type: string
          format: uuid
        item_type:
          type: string
          enum: [POST, COMMENT]
        status:
          type: string
          enum: [APPROVED, REJECTED]
        updated_at:
          type: string
          format: date-time

    RedirectionLinkItemDto:
      type: object
      required: [id, project_name, url, description]
      properties:
        id:
          type: string
          format: uuid
        project_name:
          type: string
          example: SUMA 21
        url:
          type: string
          format: uri
          example: https://suma21.fundacionasisco.org
        description:
          type: string
          example: Plataforma de inclusión y formación integral.

    FaqItemDto:
      type: object
      required: [id, question, answer, category]
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
        answer:
          type: string
        category:
          type: string
          example: Inscripciones

    EscalateRequestDto:
      type: object
      additionalProperties: false
      properties:
        topic:
          type: string
          maxLength: 120
          example: Orientación sobre matrícula AULA UP

    EscalateResponseDto:
      type: object
      required: [whatsapp_url, support_message]
      properties:
        whatsapp_url:
          type: string
          format: uri
          example: https://wa.me/573000000000?text=Hola%20Fundaci%C3%B3n%20Asisco
        support_message:
          type: string
          example: Serás redirigido de forma nativa al canal humano oficial en WhatsApp.

paths:
  /v1/auth/registro:
    post:
      tags: [AuthSession]
      summary: Registra usuario en Render, sincroniza UserAccount local y emite DeviceSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserDto'
      responses:
        '201':
          description: Usuario registrado, persistido en ASISCONEXION_DB y sesión emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponseDto'
        '400':
          description: Datos inválidos o consentimiento no aceptado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflicto — usuario o email ya registrado en Render / BD Propia
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Servicio central de Render no disponible o fallo de pasarela
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/auth/login:
    post:
      tags: [AuthSession]
      summary: Autentica usuario contra el servicio central en Render (POST /auth/login) y emite device_token local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncSessionDto'
      responses:
        '200':
          description: Cuenta sincronizada en ASISCONEXION_DB, perfil Actor asegurado y device_token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponseDto'
        '401':
          description: Credenciales inválidas o cuenta inactiva
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Indisponibilidad o rate-limit (429) en Render
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/auth/sync-session:
    post:
      tags: [AuthSession]
      summary: Alias de login sincronizado contra el servicio central en Render
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncSessionDto'
      responses:
        '200':
          description: Cuenta sincronizada en ASISCONEXION_DB y device_token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponseDto'
        '401':
          description: Credenciales inválidas o cuenta inactiva
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Indisponibilidad en verificación externa
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/actors/me:
    get:
      tags: [AuthSession]
      summary: Obtiene el perfil extendido Actor del usuario registrado actual
      security:
        - DeviceSessionBearer: []
      responses:
        '200':
          description: Perfil Actor 1:1 del usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorProfileResponseDto'
        '403':
          description: Las sesiones anónimas no poseen perfil Actor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags: [AuthSession]
      summary: Actualiza el perfil extendido Actor del usuario registrado actual
      security:
        - DeviceSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActorProfileDto'
      responses:
        '200':
          description: Perfil Actor actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorProfileResponseDto'

  /v1/actors/{id}:
    get:
      tags: [AuthSession]
      summary: Consulta el perfil público de un Actor registrado por su UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Perfil público del Actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorProfileResponseDto'

  /v1/connections:
    get:
      tags: [AuthSession]
      summary: Lista las conexiones del Actor del usuario registrado actual
      security:
        - DeviceSessionBearer: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista paginada de conexiones
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActorConnectionItemDto'
                  meta:
                    $ref: '#/components/schemas/PaginationMetaDto'
    post:
      tags: [AuthSession]
      summary: Envía una solicitud de conexión entre actores registrados (status = PENDING)
      security:
        - DeviceSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActorConnectionDto'
      responses:
        '201':
          description: Solicitud de conexión creada en estado PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorConnectionItemDto'

  /v1/connections/{id}:
    patch:
      tags: [AuthSession]
      summary: Acepta (ACCEPTED) o bloquea (BLOCKED) una conexión entre actores registrados
      security:
        - DeviceSessionBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActorConnectionStatusDto'
      responses:
        '200':
          description: Estado de conexión actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorConnectionItemDto'

  /v1/sessions/anonymous:
    post:
      tags: [AuthSession]
      summary: Inicia sesión rápida por dispositivo sin registro de cuenta completa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitAnonymousSessionDto'
      responses:
        '201':
          description: DeviceSession anónima creada con trazabilidad de consentimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousSessionResponseDto'
        '400':
          description: Consentimiento Ley 1581 no aceptado o payload inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/categories:
    get:
      tags: [Social]
      summary: Lista categorías temáticas de los foros (paginado ligero RT-01)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Página de categorías
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryItemDto'
                  meta:
                    $ref: '#/components/schemas/PaginationMetaDto'

  /v1/posts:
    get:
      tags: [Social]
      summary: Lista exclusivamente publicaciones con status = APPROVED (RT-01, RN-02)
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Página ligera de publicaciones aprobadas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicPostItemDto'
                  meta:
                    $ref: '#/components/schemas/PaginationMetaDto'
    post:
      tags: [Social]
      summary: Crea publicación forzando status = PENDING (RN-02)
      security:
        - DeviceSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostDto'
      responses:
        '201':
          description: Publicación creada en cola de moderación humana (PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSubmissionResponseDto'
        '401':
          description: DeviceSession ausente o inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/posts/{postId}/comments:
    post:
      tags: [Social]
      summary: Crea comentario forzando status = PENDING sobre publicación aprobada
      security:
        - DeviceSessionBearer: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentDto'
      responses:
        '201':
          description: Comentario registrado en estado PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSubmissionResponseDto'
        '404':
          description: Publicación no encontrada o no aprobada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

